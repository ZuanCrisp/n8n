name: "Sync Upstream: Branches, Releases & Assets"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  # A narrowly-scoped push trigger registers/runs GitSync after installation.
  # It does not run when ordinary upstream source files change.
  push:
    paths:
      - ".github/workflows/upstream-sync.yml"

# Updated by the installer in a dedicated registration commit.
# GitHub sees that commit as a change to this workflow and queues the first run.
# GitSync registration marker: 2026-11-14T11:28:45Z-ae91ae453ecf4611a4ab0600938fb102

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UPSTREAM_GIT_URL: "https://github.com/n8n-io/n8n"
      UPSTREAM_API_URL: "https://api.github.com/repos/n8n-io/n8n"
      UPSTREAM_DEFAULT_BRANCH_HINT: "master"
      UPSTREAM_BRANCH_MODE: "DEFAULT"
      UPSTREAM_BRANCH_SELECTION_ENABLED: "false"
      UPSTREAM_BRANCH_SELECTION: "branch1,branch2"
      UPSTREAM_API_PROVIDER: "github"
      UPSTREAM_WEB_BASE: "https://github.com"
      UPSTREAM_REPO_WEB_URL: "https://github.com/n8n-io/n8n"
      UPSTREAM_PROJECT_ID: "n8n-io%2Fn8n"
      UPSTREAM_WORKFLOW_FILE: ".github/workflows/upstream-sync.yml"
      GIT_LFS_ENABLED: "true"
      TAGS_SYNC_ENABLED: "false"
      TAGS_SYNC_RANGE: "1-10"
      # The same destination-only secret authenticates GitHub pushes and destination API calls.
      GH_SYNC_ZUZU: ${{ secrets.GH_SYNC_ZUZU }}
      GH_TOKEN: ${{ secrets.GH_SYNC_ZUZU }}
      DESTINATION_REPO: ${{ github.repository }}

    steps:
      - name: Validate destination credential and options
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_SYNC_ZUZU:-}" ]]; then
            echo "::error::Missing GH_SYNC_ZUZU. Add the destination GitHub PAT with Contents: read/write and Workflows: read/write."
            exit 1
          fi
          case "${GIT_LFS_ENABLED,,}" in
            true|false) ;;
            *) echo "::error::GIT_LFS_ENABLED must be true or false."; exit 1 ;;
          esac
          case "${TAGS_SYNC_ENABLED,,}" in
            true|false) ;;
            *) echo "::error::TAGS_SYNC_ENABLED must be true or false."; exit 1 ;;
          esac
          if [[ ! "$TAGS_SYNC_RANGE" =~ ^1-(ALL|[1-9][0-9]{0,6})$ ]]; then
            echo "::error::TAGS_SYNC_RANGE must be 1-N or 1-ALL (examples: 1-10, 1-1000)."
            exit 1
          fi
          if [[ "$TAGS_SYNC_RANGE" != "1-ALL" ]] && (( ${TAGS_SYNC_RANGE#1-} > 1000000 )); then
            echo "::error::TAGS_SYNC_RANGE cannot exceed 1-1000000. Use 1-ALL for every source tag."
            exit 1
          fi

      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_SYNC_ZUZU }}
          persist-credentials: true
          fetch-depth: 0
          # LFS is handled explicitly below so disabling GitLfsEnabled also disables checkout downloads.
          lfs: false

      - name: Sync selected source branches, configured tags and optional Git LFS
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GIT_LFS_ENABLED,,}" == "false" ]]; then
            export GIT_LFS_SKIP_SMUDGE=1
            echo "Git LFS is disabled; implicit LFS downloads and explicit LFS transfers are disabled."
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_GIT_URL" || git remote set-url upstream "$UPSTREAM_GIT_URL"

          # Resolve the source default branch and enumerate the available branch names on every run.
          # This follows upstream default-branch renames without fetching every branch's objects.
          DETECTED_DEFAULT=$(git ls-remote --symref upstream HEAD | awk '$1 == "ref:" && $3 == "HEAD" { sub("refs/heads/", "", $2); print $2; exit }')
          if [[ -n "$DETECTED_DEFAULT" ]]; then
            UPSTREAM_DEFAULT_BRANCH="$DETECTED_DEFAULT"
          else
            UPSTREAM_DEFAULT_BRANCH="$UPSTREAM_DEFAULT_BRANCH_HINT"
            echo "::warning::Could not detect upstream HEAD; using configured hint ${UPSTREAM_DEFAULT_BRANCH}."
          fi
          echo "Source default branch: ${UPSTREAM_DEFAULT_BRANCH}"

          ALL_SOURCE_BRANCHES=$(git ls-remote --heads upstream | awk '$2 ~ /^refs\/heads\// {sub(/^refs\/heads\//, "", $2); print $2}')
          if [[ -z "$ALL_SOURCE_BRANCHES" ]]; then
            echo "::error::The upstream repository did not return any source branches."
            exit 1
          fi

          declare -a SELECTED_BRANCHES=()
          declare -A SELECTED_BRANCH_MAP=()
          add_selected_branch() {
            local CANDIDATE="$1"
            [[ -z "$CANDIDATE" ]] && return 0
            if ! git check-ref-format --branch "$CANDIDATE" >/dev/null 2>&1; then
              echo "::error::Invalid source branch name in branch selection: ${CANDIDATE}"
              exit 1
            fi
            if ! grep -Fxq -- "$CANDIDATE" <<< "$ALL_SOURCE_BRANCHES"; then
              echo "::error::Selected source branch does not exist upstream: ${CANDIDATE}"
              exit 1
            fi
            if [[ -z "${SELECTED_BRANCH_MAP[$CANDIDATE]+x}" ]]; then
              SELECTED_BRANCH_MAP["$CANDIDATE"]=1
              SELECTED_BRANCHES+=("$CANDIDATE")
            fi
          }

          case "${UPSTREAM_BRANCH_MODE^^}" in
            ALL)
              while IFS= read -r SOURCE_BRANCH; do
                [[ -z "$SOURCE_BRANCH" ]] && continue
                add_selected_branch "$SOURCE_BRANCH"
              done <<< "$ALL_SOURCE_BRANCHES"
              if [[ "${UPSTREAM_BRANCH_SELECTION_ENABLED,,}" == "true" ]]; then
                echo "Branch mode ALL includes every source branch; the manual branch list is ignored."
              fi
              ;;
            DEFAULT)
              add_selected_branch "$UPSTREAM_DEFAULT_BRANCH"
              if [[ "${UPSTREAM_BRANCH_SELECTION_ENABLED,,}" == "true" ]]; then
                IFS=',' read -r -a MANUAL_BRANCHES <<< "${UPSTREAM_BRANCH_SELECTION:-}"
                MANUAL_COUNT=0
                for MANUAL_BRANCH in "${MANUAL_BRANCHES[@]}"; do
                  MANUAL_BRANCH="$(printf '%s' "$MANUAL_BRANCH" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
                  [[ -z "$MANUAL_BRANCH" ]] && continue
                  add_selected_branch "$MANUAL_BRANCH"
                  MANUAL_COUNT=$((MANUAL_COUNT + 1))
                done
                if (( MANUAL_COUNT == 0 )); then
                  echo "::error::Branch selection is enabled, but UPSTREAM_BRANCH_SELECTION is empty."
                  exit 1
                fi
              fi
              ;;
            *)
              echo "::error::Invalid UPSTREAM_BRANCH_MODE '${UPSTREAM_BRANCH_MODE}'. Use ALL or DEFAULT."
              exit 1
              ;;
          esac

          if (( ${#SELECTED_BRANCHES[@]} == 0 )); then
            echo "::error::Branch selection resolved to zero branches."
            exit 1
          fi
          printf 'Selected source branches: %s\n' "${SELECTED_BRANCHES[*]}"

          # Back up the workflow before resetting the default branch to source.
          WORKFLOW_BACKUP="$RUNNER_TEMP/upstream-sync-workflow.yml"
          mkdir -p "$(dirname "$WORKFLOW_BACKUP")"
          if [[ ! -f "$UPSTREAM_WORKFLOW_FILE" ]]; then
            echo "::error::The generated sync workflow '$UPSTREAM_WORKFLOW_FILE' is missing from the destination default branch. Re-run GitSync-v4.7.2.ps1 to reinstall it."
            exit 1
          fi
          cp "$UPSTREAM_WORKFLOW_FILE" "$WORKFLOW_BACKUP"

          # Remove stale upstream-tracking refs so previous branch selections cannot leak
          # into the current DEFAULT selection. Destination branches are not deleted.
          while IFS= read -r STALE_REF; do
            [[ "$STALE_REF" == "refs/remotes/upstream/HEAD" ]] && continue
            git update-ref -d "$STALE_REF"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/upstream)

          # Fetch selected branches without automatic tag following.
          FETCH_REFSPECS=()
          for SOURCE_BRANCH in "${SELECTED_BRANCHES[@]}"; do
            FETCH_REFSPECS+=("+refs/heads/${SOURCE_BRANCH}:refs/remotes/upstream/${SOURCE_BRANCH}")
          done
          git fetch --no-tags --prune --force upstream "${FETCH_REFSPECS[@]}"

          # Select tags from newest/highest version-like name backwards (v1.10 > v1.9).
          # `git ls-remote` lists names without downloading all tagged objects.
          SELECTED_TAG_NAMES=()
          if [[ "${TAGS_SYNC_ENABLED,,}" == "true" ]]; then
            mapfile -t ALL_TAG_NAMES < <(
              git ls-remote --tags --refs upstream \
                | awk '$2 ~ /^refs\/tags\// {sub(/^refs\/tags\//, "", $2); print $2}' \
                | LC_ALL=C sort -V -r
            )
            TAG_LIMIT=${#ALL_TAG_NAMES[@]}
            if [[ "$TAGS_SYNC_RANGE" != "1-ALL" ]]; then
              TAG_LIMIT=${TAGS_SYNC_RANGE#1-}
              if (( TAG_LIMIT > ${#ALL_TAG_NAMES[@]} )); then
                TAG_LIMIT=${#ALL_TAG_NAMES[@]}
              fi
            fi
            if (( TAG_LIMIT > 0 )); then
              SELECTED_TAG_NAMES=("${ALL_TAG_NAMES[@]:0:TAG_LIMIT}")
            fi
            printf 'Selected %s of %s source tags using range %s.\n' \
              "${#SELECTED_TAG_NAMES[@]}" "${#ALL_TAG_NAMES[@]}" "$TAGS_SYNC_RANGE"
            TAG_FETCH_REFSPECS=()
            for TAG_NAME in "${SELECTED_TAG_NAMES[@]}"; do
              TAG_FETCH_REFSPECS+=("+refs/tags/${TAG_NAME}:refs/upstream-tags/${TAG_NAME}")
            done
            if (( ${#TAG_FETCH_REFSPECS[@]} > 0 )); then
              for ((OFFSET=0; OFFSET<${#TAG_FETCH_REFSPECS[@]}; OFFSET+=100)); do
                BATCH_REFS=("${TAG_FETCH_REFSPECS[@]:OFFSET:100}")
                git fetch --no-tags --force upstream "${BATCH_REFS[@]}"
              done
            fi
          else
            echo "Ordinary upstream tag mirroring is disabled; release-associated tags will be handled during release sync."
          fi

          # Archive every upstream workflow file outside .github/workflows.
          # The YAML remains in source control, but GitHub Actions cannot auto-run it.
          archive_upstream_workflows() {
            local repo_root="${1:-.}"
            local workflow_root="$repo_root/.github/workflows"
            [[ -d "$workflow_root" ]] || return 0
            local archive_root="$repo_root/.upstream-archive/workflows"
            local file relative destination
            while IFS= read -r -d '' file; do
              relative="${file#"$workflow_root"/}"
              destination="$archive_root/$relative"
              mkdir -p "$(dirname "$destination")"
              mv -f -- "$file" "$destination"
            done < <(find "$workflow_root" \( -type f -o -type l \) -print0)
            find "$workflow_root" -depth -type d -empty -delete || true
            rmdir "$workflow_root" 2>/dev/null || true
          }

          # Push every selected non-default source branch after archiving its workflows.
          # Force-update is deliberate: the upstream source remains authoritative for selected branches.
          for BRANCH in "${SELECTED_BRANCHES[@]}"; do
            [[ "$BRANCH" == "$UPSTREAM_DEFAULT_BRANCH" ]] && continue
            REF="refs/remotes/upstream/${BRANCH}"
            echo "Mirroring selected source branch and archiving its workflows: $BRANCH"
            SOURCE_BRANCH_COMMIT_DATE=$(git show -s --format=%cI "$REF")
            git checkout -B "$BRANCH" "$REF"
            archive_upstream_workflows
            git add -A
            if ! git diff --cached --quiet; then
              GIT_AUTHOR_DATE="$SOURCE_BRANCH_COMMIT_DATE" GIT_COMMITTER_DATE="$SOURCE_BRANCH_COMMIT_DATE" \
                git commit -m "Archive upstream workflows for manual activation"
            fi
            git push --force origin "HEAD:refs/heads/${BRANCH}"
          done

          # Keep destination's default branch name aligned to upstream's default.
          # Preserve our generated GitSync workflow, but archive every upstream
          # workflow file (including any source file with the same filename).
          SOURCE_DEFAULT_COMMIT_DATE=$(git show -s --format=%cI "refs/remotes/upstream/${UPSTREAM_DEFAULT_BRANCH}")
          git checkout -B "$UPSTREAM_DEFAULT_BRANCH" "refs/remotes/upstream/${UPSTREAM_DEFAULT_BRANCH}"
          archive_upstream_workflows
          mkdir -p "$(dirname "$UPSTREAM_WORKFLOW_FILE")"
          cp "$WORKFLOW_BACKUP" "$UPSTREAM_WORKFLOW_FILE"
          git add -A
          if ! git diff --cached --quiet; then
            GIT_AUTHOR_DATE="$SOURCE_DEFAULT_COMMIT_DATE" GIT_COMMITTER_DATE="$SOURCE_DEFAULT_COMMIT_DATE" \
              git commit -m "Archive upstream workflows and preserve GitSync automation [skip ci]"
          fi
          git push --force origin "HEAD:refs/heads/${UPSTREAM_DEFAULT_BRANCH}"

          # Tags can also trigger workflows. Only tags in the configured latest-to-backward
          # range are synchronized here; release-associated tags outside the range are handled later.
          TAGS_PROCESSED=0
          TAGS_SANITIZED=0
          TAG_PUSH_REFSPECS=()
          if [[ "${TAGS_SYNC_ENABLED,,}" == "true" ]]; then
          for TAG_NAME in "${SELECTED_TAG_NAMES[@]}"; do
            [[ -z "$TAG_NAME" ]] && continue
            TAG_REF="refs/upstream-tags/${TAG_NAME}"
            SOURCE_TAG_OBJECT=$(git rev-parse "$TAG_REF")
            SOURCE_TAG_TYPE=$(git cat-file -t "$TAG_REF")
            if ! SOURCE_TAG_COMMIT=$(git rev-parse --verify "${TAG_REF}^{commit}" 2>/dev/null); then
              TAG_PUSH_REFSPECS+=("${TAG_REF}:refs/tags/${TAG_NAME}")
              TAGS_PROCESSED=$((TAGS_PROCESSED + 1))
              continue
            fi

            if ! git ls-tree -r --name-only "$SOURCE_TAG_COMMIT" -- .github/workflows | grep -q .; then
              # No workflow directory in this tagged tree: preserve the exact tag object.
              TAG_PUSH_REFSPECS+=("${TAG_REF}:refs/tags/${TAG_NAME}")
              TAGS_PROCESSED=$((TAGS_PROCESSED + 1))
              continue
            fi

            echo "Sanitizing workflow files in tag: ${TAG_NAME}"
            TAG_WORKTREE=$(mktemp -d)
            git worktree add --detach "$TAG_WORKTREE" "$SOURCE_TAG_COMMIT"
            git -C "$TAG_WORKTREE" config --local user.name "github-actions[bot]"
            git -C "$TAG_WORKTREE" config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            archive_upstream_workflows "$TAG_WORKTREE"

            TAG_METADATA_ID=$(printf '%s' "$TAG_NAME" | sha256sum | awk '{print $1}')
            TAG_METADATA_FILE="$TAG_WORKTREE/.upstream-archive/tag-metadata/${TAG_METADATA_ID}.txt"
            mkdir -p "$(dirname "$TAG_METADATA_FILE")"
            {
              printf 'Original tag name: %s\n' "$TAG_NAME"
              printf 'Original tag object: %s\n' "$SOURCE_TAG_OBJECT"
              printf 'Original target commit: %s\n' "$SOURCE_TAG_COMMIT"
              printf 'Original object type: %s\n\n' "$SOURCE_TAG_TYPE"
              if [[ "$SOURCE_TAG_TYPE" == "tag" ]]; then
                printf '%s\n' '--- Original annotated tag object body ---'
                git cat-file -p "$TAG_REF"
              else
                printf '%s\n' 'Lightweight tag; the original target commit is recorded above.'
              fi
            } > "$TAG_METADATA_FILE"

            TAG_SOURCE_COMMIT_DATE=$(git show -s --format=%cI "$SOURCE_TAG_COMMIT")
            git -C "$TAG_WORKTREE" add -A
            GIT_AUTHOR_DATE="$TAG_SOURCE_COMMIT_DATE" GIT_COMMITTER_DATE="$TAG_SOURCE_COMMIT_DATE" \
              git -C "$TAG_WORKTREE" commit -m "Archive upstream workflows for tag ${TAG_NAME}"
            SANITIZED_TAG_COMMIT=$(git -C "$TAG_WORKTREE" rev-parse HEAD)
            TAG_PUSH_REFSPECS+=("${SANITIZED_TAG_COMMIT}:refs/tags/${TAG_NAME}")
            git worktree remove --force "$TAG_WORKTREE"
            TAGS_PROCESSED=$((TAGS_PROCESSED + 1))
            TAGS_SANITIZED=$((TAGS_SANITIZED + 1))
          done
          if (( ${#TAG_PUSH_REFSPECS[@]} > 0 )); then
            for ((OFFSET=0; OFFSET<${#TAG_PUSH_REFSPECS[@]}; OFFSET+=100)); do
              BATCH_REFS=("${TAG_PUSH_REFSPECS[@]:OFFSET:100}")
              git push --force origin "${BATCH_REFS[@]}"
            done
          fi
          echo "Tags processed: ${TAGS_PROCESSED}; tags retargeted to sanitized archive commits: ${TAGS_SANITIZED}; selected range: ${TAGS_SYNC_RANGE}."
          else
            echo "Ordinary tag synchronization is disabled. Existing destination tags are not deleted; release-associated tags will be handled individually during release sync."
          fi

          # Changing the repository setting requires an admin-capable token.
          DEST_API="https://api.github.com/repos/${DESTINATION_REPO}"
          CURRENT_DEST_DEFAULT=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$DEST_API" | jq -r '.default_branch // empty')
          if [[ "$CURRENT_DEST_DEFAULT" != "$UPSTREAM_DEFAULT_BRANCH" ]]; then
            DEFAULT_BODY=$(jq -cn --arg branch "$UPSTREAM_DEFAULT_BRANCH" '{default_branch:$branch}')
            if curl -fsSL -X PATCH -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" -d "$DEFAULT_BODY" "$DEST_API" >/dev/null; then
              echo "Updated GitHub default branch to ${UPSTREAM_DEFAULT_BRANCH}."
            else
              echo "::warning::Could not update GitHub default branch automatically. The single GH_SYNC_ZUZU token may lack Administration: write; update Settings > General manually if needed. Sync will continue."
            fi
          fi

          # Transfer LFS objects referenced by selected branches and the selected source tag range.
          # --all is safe here because explicit refs restrict the history traversal.
          # Never run an unscoped --all: it can include unselected or stale refs.
          if [[ "${GIT_LFS_ENABLED,,}" == "true" ]]; then
            if git lfs version >/dev/null 2>&1; then
              LFS_REFS=()
              for SOURCE_BRANCH in "${SELECTED_BRANCHES[@]}"; do
                LFS_REFS+=("refs/remotes/upstream/${SOURCE_BRANCH}")
              done
              if [[ "${TAGS_SYNC_ENABLED,,}" == "true" ]]; then
                for TAG_NAME in "${SELECTED_TAG_NAMES[@]}"; do
                  [[ -z "$TAG_NAME" ]] && continue
                  TAG_REF="refs/upstream-tags/${TAG_NAME}"
                  if git rev-parse --verify "${TAG_REF}^{commit}" >/dev/null 2>&1; then
                    LFS_REFS+=("${TAG_REF}")
                  fi
                done
              fi
              if (( ${#LFS_REFS[@]} > 0 )); then
                # --all walks history reachable from these explicit refs only.
                for ((OFFSET=0; OFFSET<${#LFS_REFS[@]}; OFFSET+=50)); do
                  BATCH_REFS=("${LFS_REFS[@]:OFFSET:50}")
                  git lfs fetch --all upstream "${BATCH_REFS[@]}"
                  git lfs push --all origin "${BATCH_REFS[@]}"
                done
              fi
              echo "Git LFS transfer completed for selected branches$(if [[ "${TAGS_SYNC_ENABLED,,}" == "true" ]]; then printf ' and selected tags'; else printf ''; fi)."
            else
              echo "::warning::Git LFS is enabled but git-lfs is not installed; LFS payloads were not transferred."
            fi
          else
            echo "Git LFS disabled by configuration; no fetch or push performed."
          fi

          if [[ "${TAGS_SYNC_ENABLED,,}" == "true" ]]; then
            echo "Selected source branches mirrored: ${#SELECTED_BRANCHES[@]}; ${#SELECTED_TAG_NAMES[@]} source tags selected from range ${TAGS_SYNC_RANGE}."
          else
            echo "Selected source branches mirrored: ${#SELECTED_BRANCHES[@]}; ordinary tag sync skipped (release-associated tags handled separately)."
          fi

      - name: Collect all upstream releases
        id: releases
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$UPSTREAM_API_PROVIDER" == "git" ]]; then
            echo "Git-only upstream: no supported release API; skipping release sync. Branches are mirrored; tags follow TAGS_SYNC_ENABLED/TAGS_SYNC_RANGE; LFS follows GIT_LFS_ENABLED."
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "limited=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RELEASES_FILE="$RUNNER_TEMP/upstream-releases.jsonl"
          PAGE_FILE="$RUNNER_TEMP/upstream-release-page.json"
          : > "$RELEASES_FILE"

          api_curl() {
            local URL="$1"
            local BODY_FILE HEADER_FILE HTTP_CODE CURL_EXIT
            local ATTEMPT=1 MAX_ATTEMPTS=4 DELAY RETRY_AFTER RESET_AT REMAINING
            local RATE_LIMITED
            BODY_FILE=$(mktemp)
            HEADER_FILE=$(mktemp)

            while (( ATTEMPT <= MAX_ATTEMPTS )); do
              : > "$BODY_FILE"
              : > "$HEADER_FILE"
              if HTTP_CODE=$(curl -sS -L --connect-timeout 20 --max-time 180 \
                -D "$HEADER_FILE" -o "$BODY_FILE" -w '%{http_code}' \
                -H "Accept: application/json" \
                -H "User-Agent: GitHub-Actions-Upstream-Sync" \
                "$URL"); then
                CURL_EXIT=0
              else
                CURL_EXIT=$?
              fi

              if (( CURL_EXIT != 0 )) || [[ "$HTTP_CODE" == "000" || -z "$HTTP_CODE" ]]; then
                if (( ATTEMPT < MAX_ATTEMPTS )); then
                  DELAY=$((1 << (ATTEMPT - 1)))
                  echo "WARNING: Upstream API transport error (attempt ${ATTEMPT}/${MAX_ATTEMPTS}); retrying in ${DELAY}s." >&2
                  sleep "$DELAY"
                  ATTEMPT=$((ATTEMPT + 1))
                  continue
                fi
                echo "::error::Upstream API request failed after ${MAX_ATTEMPTS} attempts (curl exit ${CURL_EXIT})." >&2
                rm -f "$BODY_FILE" "$HEADER_FILE"
                return 1
              fi

              if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
                sleep 0.2
                cat "$BODY_FILE"
                rm -f "$BODY_FILE" "$HEADER_FILE"
                return 0
              fi

              RETRY_AFTER=$(awk 'tolower($1)=="retry-after:" {gsub("\r", "", $2); value=$2} END{print value}' "$HEADER_FILE")
              RESET_AT=$(awk 'tolower($1)=="x-ratelimit-reset:" || tolower($1)=="ratelimit-reset:" {gsub("\r", "", $2); value=$2} END{print value}' "$HEADER_FILE")
              REMAINING=$(awk 'tolower($1)=="x-ratelimit-remaining:" || tolower($1)=="ratelimit-remaining:" {gsub("\r", "", $2); value=$2} END{print value}' "$HEADER_FILE")
              RATE_LIMITED=false
              if [[ "$HTTP_CODE" == "429" ]] || \
                 { [[ "$HTTP_CODE" == "403" ]] && { [[ "$REMAINING" == "0" ]] || [[ -n "$RETRY_AFTER" ]] || grep -Eiq 'rate.?limit|too many requests|secondary rate limit|abuse detection' "$BODY_FILE"; }; }; then
                RATE_LIMITED=true
              fi

              if [[ "$HTTP_CODE" == "401" ]] || { [[ "$HTTP_CODE" == "403" ]] && [[ "$RATE_LIMITED" != true ]]; }; then
                echo "::error::Anonymous upstream API access was denied (HTTP ${HTTP_CODE}). Confirm the source repository is public and the API endpoint is correct." >&2
                [[ ! -s "$BODY_FILE" ]] || head -c 1000 "$BODY_FILE" >&2
                echo >&2
                rm -f "$BODY_FILE" "$HEADER_FILE"
                return 1
              fi

              if [[ "$RATE_LIMITED" == true ]] || [[ "$HTTP_CODE" =~ ^5[0-9][0-9]$ ]]; then
                if (( ATTEMPT >= MAX_ATTEMPTS )); then
                  echo "::error::Upstream API still unavailable after ${MAX_ATTEMPTS} attempts (HTTP ${HTTP_CODE})." >&2
                  [[ ! -s "$BODY_FILE" ]] || head -c 1000 "$BODY_FILE" >&2
                  echo >&2
                  rm -f "$BODY_FILE" "$HEADER_FILE"
                  return 1
                fi

                if [[ "$RATE_LIMITED" == true ]]; then
                  if [[ "$RETRY_AFTER" =~ ^[0-9]+$ ]]; then
                    DELAY="$RETRY_AFTER"
                    (( DELAY < 1 )) && DELAY=1
                  elif [[ "$REMAINING" == "0" && "$RESET_AT" =~ ^[0-9]+$ ]]; then
                    DELAY=$((RESET_AT - $(date +%s)))
                    (( DELAY < 1 )) && DELAY=1
                  else
                    DELAY=$((60 * (1 << (ATTEMPT - 1))))
                  fi
                  echo "WARNING: Upstream API rate limit (HTTP ${HTTP_CODE}); retry ${ATTEMPT}/${MAX_ATTEMPTS} in ${DELAY}s." >&2
                else
                  DELAY=$((1 << (ATTEMPT - 1)))
                  echo "WARNING: Upstream API server error (HTTP ${HTTP_CODE}); retry ${ATTEMPT}/${MAX_ATTEMPTS} in ${DELAY}s." >&2
                fi
                sleep "$DELAY"
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi

              echo "::error::Upstream API returned HTTP ${HTTP_CODE}; not retrying this response." >&2
              [[ ! -s "$BODY_FILE" ]] || head -c 1000 "$BODY_FILE" >&2
              echo >&2
              rm -f "$BODY_FILE" "$HEADER_FILE"
              return 1
            done

            rm -f "$BODY_FILE" "$HEADER_FILE"
            return 1
          }

          PAGE=1
          RELEASE_LIMITED=false
          while true; do
            case "$UPSTREAM_API_PROVIDER" in
              gitea|forgejo)
                PAGE_SIZE=50
                PAGE_URL="${UPSTREAM_API_URL}/releases?limit=${PAGE_SIZE}&page=${PAGE}"
                ;;
              *)
                PAGE_SIZE=100
                PAGE_URL="${UPSTREAM_API_URL}/releases?per_page=${PAGE_SIZE}&page=${PAGE}"
                ;;
            esac

            echo "Fetching upstream release page ${PAGE}..."
            api_curl "$PAGE_URL" > "$PAGE_FILE"
            if ! jq -e 'type == "array"' "$PAGE_FILE" >/dev/null; then
              echo "Upstream release API did not return a JSON array."
              cat "$PAGE_FILE"
              exit 1
            fi

            COUNT=$(jq 'length' "$PAGE_FILE")
            if (( COUNT == 0 )); then
              break
            fi

            jq -c '.[] | select(.draft != true)' "$PAGE_FILE" >> "$RELEASES_FILE"

            # GitHub REST List Releases exposes only the first 1,000 results.
            # With 100 results per page, never request page 11 (which returns HTTP 422).
            # We cannot know whether there are additional releases beyond the API cap,
            # so report a cap warning and continue with the releases already collected.
            if [[ "$UPSTREAM_API_PROVIDER" == "github" ]] && (( PAGE >= 10 )); then
              if (( COUNT == PAGE_SIZE )); then
                RELEASE_LIMITED=true
                echo "::warning::GitHub Releases API reached its 1,000-result listing cap. Collected the first 1,000 API results; additional older releases may exist but cannot be enumerated through this endpoint. Continuing with collected releases."
                echo "WARNING: GitHub Releases API cap reached at page 10; continuing with collected releases."
                echo "⚠️ GitHub Releases API cap reached: first 1,000 API results collected; older results may not be accessible through this endpoint." >> "$GITHUB_STEP_SUMMARY"
              fi
              break
            fi

            # For APIs without GitHub's 1,000-result cap, continue normal pagination.
            if (( COUNT < PAGE_SIZE )); then
              break
            fi

            PAGE=$((PAGE + 1))
            if (( PAGE > 1000 )); then
              echo "::warning::Safety stop after 1,000 release pages. Continuing with the releases collected so far."
              RELEASE_LIMITED=true
              break
            fi
          done

          RELEASE_COUNT=$(wc -l < "$RELEASES_FILE" | tr -d ' ')
          echo "count=$RELEASE_COUNT" >> "$GITHUB_OUTPUT"
          echo "limited=$RELEASE_LIMITED" >> "$GITHUB_OUTPUT"
          echo "Found ${RELEASE_COUNT} published releases/pre-releases."
          if [[ "$RELEASE_LIMITED" == "true" ]]; then
            echo "Release collection was partial because an API result cap was reached; release publishing will continue for collected entries."
          fi

      - name: Download and publish every release and its assets
        if: steps.releases.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          RELEASES_FILE="$RUNNER_TEMP/upstream-releases.jsonl"
          TOTAL=$(wc -l < "$RELEASES_FILE" | tr -d ' ')
          CURRENT=0
          TOTAL_ASSETS=0

          source_curl() {
            local URL="$1"
            curl -fL --connect-timeout 20 --max-time 900 --retry 4 --retry-all-errors --retry-delay 2 "$URL" -o "$2"
            [[ -s "$2" ]] || { echo "Downloaded release asset is empty: $SAFE_NAME" >&2; return 1; }
          }

          archive_release_tag_workflows() {
            local REPO_ROOT="${1:-.}"
            local WORKFLOW_ROOT="$REPO_ROOT/.github/workflows"
            [[ -d "$WORKFLOW_ROOT" ]] || return 0
            local ARCHIVE_ROOT="$REPO_ROOT/.upstream-archive/workflows"
            local FILE RELATIVE TARGET
            while IFS= read -r -d '' FILE; do
              RELATIVE="${FILE#"$WORKFLOW_ROOT"/}"
              TARGET="$ARCHIVE_ROOT/$RELATIVE"
              mkdir -p "$(dirname "$TARGET")"
              mv -f "$FILE" "$TARGET"
            done < <(find "$WORKFLOW_ROOT" -type f -print0)
            rm -rf "$WORKFLOW_ROOT"
          }

          ensure_release_tag_on_destination() {
            local RELEASE_TAG="$1"
            local SOURCE_TAG_REF="refs/upstream-release-tags/$RELEASE_TAG"
            local SOURCE_TAG_OBJECT SOURCE_TAG_TYPE SOURCE_TAG_COMMIT TAG_WORKTREE TAG_METADATA_ID TAG_SOURCE_DATE SANITIZED_TAG_COMMIT

            if ! git check-ref-format "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Invalid release tag name from upstream API: ${RELEASE_TAG}"
              return 1
            fi

            if git show-ref --verify --quiet "refs/upstream-tags/${RELEASE_TAG}"; then
              echo "Release tag ${RELEASE_TAG} is already included in the configured tag range."
              return 0
            fi

            echo "Fetching release-associated tag outside the ordinary tag range: ${RELEASE_TAG}"
            git fetch --no-tags --force upstream "refs/tags/${RELEASE_TAG}:${SOURCE_TAG_REF}"
            SOURCE_TAG_OBJECT=$(git rev-parse "$SOURCE_TAG_REF")
            SOURCE_TAG_TYPE=$(git cat-file -t "$SOURCE_TAG_REF")
            if ! SOURCE_TAG_COMMIT=$(git rev-parse --verify "${SOURCE_TAG_REF}^{commit}" 2>/dev/null); then
              echo "::error::Release tag ${RELEASE_TAG} does not resolve to a commit."
              return 1
            fi

            if git ls-tree -r --name-only "$SOURCE_TAG_COMMIT" -- .github/workflows | grep -q .; then
              TAG_WORKTREE=$(mktemp -d)
              git worktree add --detach "$TAG_WORKTREE" "$SOURCE_TAG_COMMIT"
              git -C "$TAG_WORKTREE" config --local user.name "github-actions[bot]"
              git -C "$TAG_WORKTREE" config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
              archive_release_tag_workflows "$TAG_WORKTREE"

              TAG_METADATA_ID=$(printf '%s' "$RELEASE_TAG" | sha256sum | awk '{print $1}')
              TAG_METADATA_FILE="$TAG_WORKTREE/.upstream-archive/tag-metadata/${TAG_METADATA_ID}.txt"
              mkdir -p "$(dirname "$TAG_METADATA_FILE")"
              {
                printf 'Original tag name: %s\n' "$RELEASE_TAG"
                printf 'Original tag object: %s\n' "$SOURCE_TAG_OBJECT"
                printf 'Original target commit: %s\n' "$SOURCE_TAG_COMMIT"
                printf 'Original object type: %s\n\n' "$SOURCE_TAG_TYPE"
                if [[ "$SOURCE_TAG_TYPE" == "tag" ]]; then
                  printf '%s\n' '--- Original annotated tag object body ---'
                  git cat-file -p "$SOURCE_TAG_REF"
                else
                  printf '%s\n' 'Lightweight tag; the original target commit is recorded above.'
                fi
              } > "$TAG_METADATA_FILE"

              TAG_SOURCE_DATE=$(git show -s --format=%cI "$SOURCE_TAG_COMMIT")
              git -C "$TAG_WORKTREE" add -A
              GIT_AUTHOR_DATE="$TAG_SOURCE_DATE" GIT_COMMITTER_DATE="$TAG_SOURCE_DATE" \
                git -C "$TAG_WORKTREE" commit -m "Archive upstream workflows for release tag ${RELEASE_TAG}"
              SANITIZED_TAG_COMMIT=$(git -C "$TAG_WORKTREE" rev-parse HEAD)
              git push --force origin "${SANITIZED_TAG_COMMIT}:refs/tags/${RELEASE_TAG}"
              git worktree remove --force "$TAG_WORKTREE"
            else
              # Preserve the exact lightweight/annotated upstream tag object when no workflow tree needs archiving.
              git push --force origin "${SOURCE_TAG_REF}:refs/tags/${RELEASE_TAG}"
            fi

            if [[ "${GIT_LFS_ENABLED,,}" == "true" ]]; then
              if git lfs version >/dev/null 2>&1; then
                git lfs fetch --all upstream "$SOURCE_TAG_REF"
                git lfs push --all origin "$SOURCE_TAG_REF"
              else
                echo "::warning::Git LFS is enabled but git-lfs is unavailable; release-tag LFS objects were not transferred."
              fi
            fi
          }

          while IFS= read -r RELEASE_JSON; do
            [[ -z "$RELEASE_JSON" ]] && continue
            CURRENT=$((CURRENT + 1))
            TAG=$(jq -r '.tag_name // empty' <<< "$RELEASE_JSON")
            TITLE=$(jq -r '.name // .tag_name // "Untitled release"' <<< "$RELEASE_JSON")
            PRERELEASE=$(jq -r 'if .prerelease == true then "true" else "false" end' <<< "$RELEASE_JSON")
            [[ -z "$TAG" ]] && { echo "Skipping release without a tag."; continue; }
            # Published release tags are always preserved, even when outside the ordinary tag range.
            ensure_release_tag_on_destination "$TAG"

            echo "=================================================="
            echo "Release ${CURRENT}/${TOTAL}: ${TAG}"
            TEMP_DIR=$(mktemp -d)
            ASSET_DIR="$TEMP_DIR/assets"
            mkdir -p "$ASSET_DIR"
            jq -r '.body // .description // "Synced from upstream release."' <<< "$RELEASE_JSON" > "$TEMP_DIR/release-notes.md"

            ASSET_LIST="$TEMP_DIR/assets.jsonl"
            : > "$ASSET_LIST"

            # GitHub, GitLab, Gitea and Forgejo expose differently shaped asset arrays.
            jq -c '
              if (.assets | type) == "array" then .assets[]?
              elif (.assets.attachments | type) == "array" then .assets.attachments[]?
              elif (.assets.links | type) == "array" then .assets.links[]?
              else empty end
              | {name:(.name // .label // .file_name // ""), url:(.browser_download_url // .direct_asset_url // .url // "")}
              | select(.name != "" and .url != "")
            ' <<< "$RELEASE_JSON" >> "$ASSET_LIST"

            # GitLab Markdown uploads changed to project-ID-based URLs in GitLab 17.2.
            # Resolve the numeric project ID from the API, then normalize legacy /uploads links
            # in both the release API asset list and Markdown release notes.
            if [[ "$UPSTREAM_API_PROVIDER" == "gitlab" ]]; then
              GITLAB_PROJECT_JSON=$(curl -fsSL --retry 3 --retry-all-errors \
                -H "Accept: application/json" \
                -H "User-Agent: GitHub-Actions-Upstream-Sync" \
                "$UPSTREAM_API_URL")
              GITLAB_PROJECT_NUMERIC_ID=$(jq -r '.id // empty' <<< "$GITLAB_PROJECT_JSON")
              if [[ ! "$GITLAB_PROJECT_NUMERIC_ID" =~ ^[0-9]+$ ]]; then
                echo "::error::GitLab project API did not return a numeric project ID. Cannot normalize Markdown upload URLs safely."
                echo "$GITLAB_PROJECT_JSON" | jq '{message, error, error_description}' 2>/dev/null || true
                rm -rf "$TEMP_DIR"
                exit 1
              fi
              echo "GitLab project numeric ID: ${GITLAB_PROJECT_NUMERIC_ID}"

              python3 - "$TEMP_DIR/release-notes.md" "$ASSET_LIST" "$UPSTREAM_REPO_WEB_URL" "$UPSTREAM_API_URL" "$GITLAB_PROJECT_NUMERIC_ID" <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.parse import unquote, urljoin, urlparse, urlunparse

          body_path, asset_path, repo_url, api_url, project_id = sys.argv[1:]
          repo = urlparse(repo_url)
          api = urlparse(api_url)
          source_host = repo.netloc.lower()

          # Support GitLab installed below a URL prefix, for example /gitlab/api/v4/...
          api_path = api.path or ""
          api_match = re.search(r"(?i)/api/v4/projects(?:/|$)", api_path)
          instance_prefix = api_path[:api_match.start()].rstrip("/") if api_match else ""

          def normalize_gitlab_upload(raw_url):
              candidate = urljoin(repo_url.rstrip("/") + "/", raw_url.strip().strip("<>"))
              parsed = urlparse(candidate)
              if parsed.netloc.lower() != source_host:
                  return candidate

              path = parsed.path or ""
              # Already in the modern GitLab URL format; preserve it as-is.
              if re.search(r"/-/project/[0-9]+/uploads/", path, re.I):
                  return candidate

              # Legacy Markdown upload links use /uploads/<secret>/<filename>.
              # Some older notes may contain a project-relative uploads/ path instead.
              marker = "/uploads/"
              marker_index = path.lower().find(marker)
              if marker_index < 0:
                  return candidate

              suffix = path[marker_index + len(marker):].lstrip("/")
              if not suffix:
                  return candidate

              modern_path = f"{instance_prefix}/-/project/{project_id}/uploads/{suffix}"
              return urlunparse(parsed._replace(path=modern_path))

          def is_downloadable_markdown_link(url):
              parsed = urlparse(url)
              if parsed.netloc.lower() != source_host:
                  return False
              path = parsed.path.lower()
              is_upload = f"/-/project/{project_id}/uploads/" in path or "/uploads/" in path
              has_binary_extension = bool(re.search(
                  r"\.(zip|7z|rar|tar|tgz|gz|bz2|xz|zst|exe|msi|appimage|deb|rpm|bin|iso|dmg|apk|jar|war|dll|so)(?:$|[?#])",
                  path,
                  re.I,
              ))
              return is_upload or has_binary_extension

          # Normalize URLs already returned by the GitLab Release API.
          normalized = []
          seen = set()
          if os.path.exists(asset_path):
              with open(asset_path, encoding="utf-8") as source:
                  for line in source:
                      try:
                          item = json.loads(line)
                          url = item.get("url", "")
                          if url:
                              item["url"] = normalize_gitlab_upload(url)
                          key = item.get("url", "")
                          if key and key not in seen:
                              normalized.append(item)
                              seen.add(key)
                      except (json.JSONDecodeError, TypeError):
                          continue

          # GitLab projects sometimes publish binaries only as Markdown links in release notes.
          body = open(body_path, encoding="utf-8", errors="replace").read()
          for label, href in re.findall(r"\[([^\]]+)\]\(([^)]+)\)", body):
              href = href.strip().strip("<>")
              if not href or href.startswith(("mailto:", "#", "javascript:")):
                  continue
              url = normalize_gitlab_upload(href)
              if not is_downloadable_markdown_link(url) or url in seen:
                  continue
              parsed = urlparse(url)
              name = unquote(os.path.basename(parsed.path)) or label.strip() or "release-asset"
              normalized.append({"name": name, "url": url})
              seen.add(url)

          with open(asset_path, "w", encoding="utf-8") as output:
              for item in normalized:
                  output.write(json.dumps(item, ensure_ascii=False) + "\n")

          print(f"Normalized GitLab release assets: {len(normalized)} candidate(s)")
          PY
            fi

            # Assets already attached to the destination release are skipped (no re-download/re-upload).
            EXISTING_ASSETS=$(gh release view "$TAG" --repo "$DESTINATION_REPO" --json assets -q '.assets[].name' 2>/dev/null || true)
            ASSET_COUNT=0
            SKIPPED_ASSETS=0
            INDEX=0
            while IFS= read -r ASSET_JSON; do
              [[ -z "$ASSET_JSON" ]] && continue
              INDEX=$((INDEX + 1))
              ASSET_NAME=$(jq -r '.name' <<< "$ASSET_JSON")
              ASSET_URL=$(jq -r '.url' <<< "$ASSET_JSON")
              SAFE_NAME=$(basename "$ASSET_NAME")
              [[ -z "$SAFE_NAME" || "$SAFE_NAME" == "." || "$SAFE_NAME" == ".." ]] && SAFE_NAME="asset-${INDEX}"
              if [[ -n "$EXISTING_ASSETS" ]] && grep -Fxq -- "$SAFE_NAME" <<< "$EXISTING_ASSETS"; then
                echo "Skip (already on destination): $SAFE_NAME"
                SKIPPED_ASSETS=$((SKIPPED_ASSETS + 1))
                continue
              fi
              DEST_ASSET="$ASSET_DIR/$SAFE_NAME"
              if [[ -e "$DEST_ASSET" ]]; then
                DEST_ASSET="$ASSET_DIR/${INDEX}-${SAFE_NAME}"
              fi
              echo "Downloading/updating upstream asset: $SAFE_NAME"
              source_curl "$ASSET_URL" "$DEST_ASSET"
              if [[ ! -s "$DEST_ASSET" ]]; then
                echo "::error::Downloaded asset is empty: ${SAFE_NAME} (${ASSET_URL})"
                rm -rf "$TEMP_DIR"
                exit 1
              fi
              ASSET_COUNT=$((ASSET_COUNT + 1))
              TOTAL_ASSETS=$((TOTAL_ASSETS + 1))
            done < "$ASSET_LIST"

            # Generate the checksum file only for a fresh release so a partial list never overwrites a complete one.
            if (( ASSET_COUNT > 0 )) && [[ -z "$EXISTING_ASSETS" ]]; then
              CHECKSUM_NAME="SHA256SUMS-upstream.txt"
              (
                cd "$ASSET_DIR"
                find . -maxdepth 1 -type f ! -name "$CHECKSUM_NAME" -print0 | sort -z | xargs -0 -r sha256sum
              ) > "$ASSET_DIR/$CHECKSUM_NAME"
            fi

            if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} is not on destination; cannot safely publish release."
              rm -rf "$TEMP_DIR"
              exit 1
            fi

            if gh release view "$TAG" --repo "$DESTINATION_REPO" >/dev/null 2>&1; then
              gh release edit "$TAG" --repo "$DESTINATION_REPO" --title "$TITLE" --notes-file "$TEMP_DIR/release-notes.md"
            else
              if [[ "$PRERELEASE" == "true" ]]; then
                gh release create "$TAG" --repo "$DESTINATION_REPO" --title "$TITLE" --notes-file "$TEMP_DIR/release-notes.md" --prerelease --verify-tag
              else
                gh release create "$TAG" --repo "$DESTINATION_REPO" --title "$TITLE" --notes-file "$TEMP_DIR/release-notes.md" --verify-tag
              fi
            fi
            # GitHub recommends spacing mutative API requests to reduce secondary-rate-limit risk.
            sleep 1

            shopt -s nullglob
            ASSETS=("$ASSET_DIR"/*)
            if (( ${#ASSETS[@]} > 0 )); then
              gh release upload "$TAG" "${ASSETS[@]}" --repo "$DESTINATION_REPO" --clobber
              sleep 1
            fi
            rm -rf "$TEMP_DIR"
            echo "Completed release: ${TAG} (assets downloaded: ${ASSET_COUNT}, skipped: ${SKIPPED_ASSETS})"
          done < "$RELEASES_FILE"

          echo "Release sync finished. Releases: ${CURRENT}; assets: ${TOTAL_ASSETS}."

      - name: Sync summary
        if: always()
        run: |
          echo "Upstream sync workflow finished. Check preceding steps for provider-specific skips or warnings."
